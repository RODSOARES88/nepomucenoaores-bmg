name: Varredura semanal de notícias jurídicas

# Roda toda segunda 2 vezes pra redundância:
#   12:07 UTC (~09:07 BRT) · janela principal
#   15:07 UTC (~12:07 BRT) · backup se GitHub pulou o primeiro
# O script é idempotente (varre últimos 7 dias) · rodar 2x na mesma segunda
# não duplica notícias (o NEWS é reescrito, não acrescentado).
#
# Também pode ser disparado manualmente via "Run workflow" na UI.
on:
  schedule:
    - cron: '7 12 * * 1'   # segunda 12:07 UTC · principal
    - cron: '7 15 * * 1'   # segunda 15:07 UTC · backup
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  varredura:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install staticrypt
        run: npm install -g staticrypt

      # ─── Verificar se já houve varredura hoje (evita rodar 2x na mesma segunda) ───
      - name: Check if already ran today
        id: check_ran
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Olha últimos 5 commits do bot · se algum tem a data de hoje, pula
          if git log --oneline --since="$TODAY" --author="BMG News Bot" | grep -q "varredura semanal"; then
            echo "already_ran=true" >> $GITHUB_OUTPUT
            echo "✓ Já houve varredura hoje · pulando."
          else
            echo "already_ran=false" >> $GITHUB_OUTPUT
            echo "→ Sem varredura hoje · vai rodar."
          fi

      - name: Decrypt current site
        if: steps.check_ran.outputs.already_ran == 'false'
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          mkdir -p decrypted
          staticrypt --decrypt index.html -p "$STATICRYPT_PASSWORD" -d decrypted/

      # ─── Rodar varredura com retry (3 tentativas) ─────────────────────
      - name: Run varredura (with retry)
        if: steps.check_ran.outputs.already_ran == 'false'
        id: varredura
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "── Tentativa $i/$MAX_ATTEMPTS ──"
            if python scripts/varredura_noticias.py; then
              echo "✓ Varredura OK na tentativa $i"
              exit 0
            else
              CODE=$?
              if [ $CODE -eq 1 ]; then
                echo "→ Sem novidades relevantes (exit 1) · não é erro"
                exit 0
              fi
              echo "✗ Tentativa $i falhou (exit $CODE)"
              if [ $i -lt $MAX_ATTEMPTS ]; then
                SLEEP=$((30 * i))
                echo "  aguardando ${SLEEP}s antes de tentar de novo..."
                sleep $SLEEP
              fi
            fi
          done
          echo "✗✗✗ Todas as $MAX_ATTEMPTS tentativas falharam"
          exit 2

      - name: Validate JS
        if: steps.check_ran.outputs.already_ran == 'false' && steps.varredura.outcome == 'success'
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('decrypted/index.html', 'utf8');
            const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            const vm = require('vm');
            scripts.forEach((s, i) => {
              try { new vm.Script(s, {filename: 'script_' + i + '.js'}); }
              catch(e) { console.error('ERR script', i, ':', e.message); process.exit(1); }
            });
            console.log('All ' + scripts.length + ' scripts parsed OK');
          "

      - name: Encrypt with StatiCrypt
        if: steps.check_ran.outputs.already_ran == 'false' && steps.varredura.outcome == 'success'
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: staticrypt decrypted/index.html -p "$STATICRYPT_PASSWORD" --short -d .

      - name: Commit changes
        if: steps.check_ran.outputs.already_ran == 'false' && steps.varredura.outcome == 'success'
        run: |
          git config user.name "BMG News Bot"
          git config user.email "actions@users.noreply.github.com"
          # 🔒 SEGURANÇA (2026-07-01): NUNCA commitar decrypted/ — o repo é público
          # e o claro anula a senha StatiCrypt. Sincronia humano↔bot agora é:
          # antes de editar local, git pull + re-descriptografar do index.html
          # cifrado (staticrypt --decrypt · igual este workflow faz no passo acima).
          git add index.html briefings-semanais/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças pra commitar"
          else
            git commit -m "auto: varredura semanal de notícias jurídicas $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open briefing issue
        if: steps.check_ran.outputs.already_ran == 'false' && hashFiles('briefing-latest.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('briefing-latest.md', 'utf8');
            const dataStr = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📰 Briefing semanal · ${dataStr}`,
              body: body,
              labels: ['varredura-noticias', 'briefing-semanal']
            });

      # ─── Abrir issue de FALHA se varredura falhou (NOVO · sai do silêncio) ───
      - name: Open failure issue
        if: steps.check_ran.outputs.already_ran == 'false' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const dataStr = new Date().toISOString().slice(0, 10);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Varredura de notícias FALHOU · ${dataStr}`,
              body: `O workflow de varredura semanal falhou em ${dataStr}.\n\n` +
                    `**Causa provável:** API timeout, rate limit, ou erro no script Python (3 tentativas com retry já feitas).\n\n` +
                    `**Próxima ação:** abrir o log do run e identificar a falha · pode disparar manual via UI.\n\n` +
                    `🔗 [Ver log do run](${runUrl})`,
              labels: ['varredura-noticias', 'erro', 'urgente']
            });

      - name: Report status
        if: always()
        run: echo "Varredura concluída · already_ran=${{ steps.check_ran.outputs.already_ran }} · outcome=${{ steps.varredura.outcome }}"
