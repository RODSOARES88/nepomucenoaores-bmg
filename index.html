<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Inteligência Jurídica — BMG</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#F4F6FA;color:#1a1a1a;min-height:100vh}
  .topbar{background:#1E2B6A;color:#fff;padding:14px 32px;display:flex;align-items:center;gap:16px}
  .topbar h1{font-size:16px;font-weight:500}
  .topbar span{font-size:12px;opacity:.6;margin-left:auto}
  .container{max-width:900px;margin:0 auto;padding:24px 16px}
  .selectors{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;background:#fff;border-radius:12px;padding:20px;border:1px solid #e0e4f0}
  .sel-group label{font-size:12px;color:#666;display:block;margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  select{width:100%;padding:10px 12px;border:1px solid #d0d5e8;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;cursor:pointer}
  select:focus{outline:none;border-color:#1E2B6A}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .card{background:#fff;border-radius:10px;padding:16px;border:1px solid #e0e4f0}
  .card-label{font-size:11px;color:#888;margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .card-value{font-size:26px;font-weight:600}
  .card-sub{font-size:11px;color:#999;margin-top:3px}
  .card.ok .card-value{color:#2d7a2d}
  .card.warn .card-value{color:#a06000}
  .card.alert .card-value{color:#c0392b}
  .section{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px;border:1px solid #e0e4f0}
  .section-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
  .risks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .risk-item{background:#f8f9fc;border-radius:8px;padding:12px}
  .risk-label{font-size:12px;color:#666;margin-bottom:6px}
  .risk-bar-wrap{height:5px;background:#e0e4f0;border-radius:3px;margin-bottom:6px;overflow:hidden}
  .risk-bar{height:5px;border-radius:3px;transition:width .5s}
  .risk-pct{font-size:13px;font-weight:600}
  .risk-pct.low{color:#2d7a2d}.risk-pct.mid{color:#a06000}.risk-pct.high{color:#c0392b}
  .enc-rows{display:grid;gap:8px}
  .enc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f2f8}
  .enc-row:last-child{border-bottom:none}
  .enc-label{font-size:13px;color:#666}
  .enc-value{font-size:13px;font-weight:600;color:#1a1a1a}
  .args{display:grid;gap:8px}
  .arg-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px}
  .arg-row.vit{background:#f0faf0;border:1px solid #c8e6c8}
  .arg-row.der{background:#fff5f5;border:1px solid #f5c6c6}
  .arg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .arg-dot.vit{background:#2d7a2d}.arg-dot.der{background:#c0392b}
  .arg-text{flex:1;color:#1a1a1a}
  .arg-badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
  .arg-badge.vit{background:#c8e6c8;color:#1a5c1a}
  .arg-badge.der{background:#f5c6c6;color:#8b1a1a}
  .strat-box{border-radius:10px;padding:16px;border-left:4px solid}
  .strat-box.manter{background:#f0faf0;border-color:#2d7a2d}
  .strat-box.monitor{background:#fffbf0;border-color:#a06000}
  .strat-box.revisar{background:#fff5f5;border-color:#c0392b}
  .strat-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .strat-box.manter .strat-label{color:#2d7a2d}
  .strat-box.monitor .strat-label{color:#a06000}
  .strat-box.revisar .strat-label{color:#c0392b}
  .strat-desc{font-size:13px;color:#333;line-height:1.6}
  .footer{text-align:center;padding:24px;font-size:12px;color:#999}
  .updated{font-size:11px;color:#aaa;text-align:right;margin-top:4px}
  @media(max-width:600px){
    .cards{grid-template-columns:1fr 1fr}
    .selectors{grid-template-columns:1fr}
  }
</style>
</head>

function fmt(n){return n>0?'R$ '+n.toLocaleString('pt-BR'):'-'}
function pctC(p){return p<=15?'low':p<=30?'mid':'high'}
function barC(p){return p<=15?'#2d7a2d':p<=30?'#a06000':'#c0392b'}

function render(){
  const uf=document.getElementById('sel-uf').value;
  const causa=document.getElementById('sel-causa').value;
  const d=DATA[uf][causa];
  if(!d||d.proc===0){
    document.getElementById('output').innerHTML='<div style="background:#fff;border-radius:10px;padding:24px;border:1px solid #e0e4f0;color:#888;font-size:14px">Sem processos registrados para esta combinação.</div>';
    return;
  }
  const derrota=100-d.exito;
  const dmPct=d.proc>0?Math.round(d.dm/d.proc*100):0;
  const dobroPct=d.proc>0?Math.round(d.dobro/d.proc*100):0;
  const exitoClass=d.exito>=60?'ok':d.exito>=45?'warn':'alert';
  const derrotaClass=derrota<=40?'ok':derrota<=55?'warn':'alert';
  const ticketClass=d.ticketDobro>30000?'alert':d.ticketDobro>20000?'warn':'ok';
  const stratIcon=d.strat==='manter'?'Manter estratégia':d.strat==='monitor'?'Monitorar e ajustar':'Revisar tese — urgente';

  document.getElementById('output').innerHTML=`
    <div class="cards">
      <div class="card ${exitoClass}">
        <div class="card-label">Chance de vitória</div>
        <div class="card-value">${d.exito}%</div>
        <div class="card-sub">${d.proc} processos analisados</div>
      </div>
      <div class="card ${derrotaClass}">
        <div class="card-label">Chance de derrota</div>
        <div class="card-value">${derrota}%</div>
        <div class="card-sub">plena ou parcial</div>
      </div>
      <div class="card">
        <div class="card-label">Ticket médio geral</div>
        <div class="card-value" style="font-size:18px;margin-top:4px">${fmt(d.ticket)}</div>
        <div class="card-sub">valor da causa</div>
      </div>
      <div class="card ${ticketClass}">
        <div class="card-label">Possível condenação</div>
        <div class="card-value" style="font-size:18px;margin-top:4px">${fmt(d.ticketCond)}</div>
        <div class="card-sub">média nas derrotas</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="section">
        <div class="section-title">Riscos financeiros nas derrotas</div>
        <div style="display:grid;gap:12px">
          <div class="risk-item">
            <div class="risk-label">Dano moral condenado</div>
            <div class="risk-bar-wrap"><div class="risk-bar" style="width:${Math.min(dmPct*3,100)}%;background:${barC(dmPct)}"></div></div>
            <div class="risk-pct ${pctC(dmPct)}">${dmPct}% das derrotas · ${d.dm} casos</div>
          </div>
          <div class="risk-item">
            <div class="risk-label">Restituição em dobro</div>
            <div class="risk-bar-wrap"><div class="risk-bar" style="width:${Math.min(dobroPct*3,100)}%;background:${barC(dobroPct)}"></div></div>
            <div class="risk-pct ${pctC(dobroPct)}">${dobroPct}% das derrotas · ${d.dobro} casos</div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Encerramento e acordo</div>
        <div class="enc-rows">
          <div class="enc-row">
            <span class="enc-label">Tempo médio do processo</span>
            <span class="enc-value">${d.aging} dias (~${Math.round(d.aging/30)} meses)</span>
          </div>
          <div class="enc-row">
            <span class="enc-label">Acordos pré-sentença</span>
            <span class="enc-value">${d.acPre} registrados</span>
          </div>
          <div class="enc-row">
            <span class="enc-label">Acordos pós-sentença</span>
            <span class="enc-value">${d.acPos} registrados</span>
          </div>
          <div class="enc-row">
            <span class="enc-label">Ticket médio derrota plena</span>
            <span class="enc-value">${fmt(d.ticketDobro)}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section" style="margin-bottom:16px">
      <div class="section-title">Fundamentos jurídicos identificados nas decisões</div>
      <div class="args">
        ${d.args_vit.map(a=>`<div class="arg-row vit"><div class="arg-dot vit"></div><span class="arg-text">${a}</span><span class="arg-badge vit">nas vitórias</span></div>`).join('')}
        ${d.args_der.map(a=>`<div class="arg-row der"><div class="arg-dot der"></div><span class="arg-text">${a}</span><span class="arg-badge der">nas derrotas</span></div>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Diretriz estratégica</div>
      <div class="strat-box ${d.strat}">
        <div class="strat-label">${stratIcon}</div>
        <div class="strat-desc">${d.strat_txt}</div>
      </div>
    </div>
  `;
}
render();
</script>
</body>
</html>
