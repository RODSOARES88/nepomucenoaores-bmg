*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#F4F6FA;color:#1a1a1a;min-height:100vh}
.topbar{background:#1E2B6A;color:#fff;padding:14px 32px;display:flex;align-items:center;gap:16px}

.tabs{background:#fff;border-bottom:1px solid #e0e4f0;padding:0 24px;display:flex;gap:0}
.tab{padding:14px 20px;font-size:13px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#1E2B6A}
.tab.active{color:#1E2B6A;border-bottom-color:#1E2B6A}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
.panel{display:none}.panel.active{display:block}
.selectors{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;background:#fff;border-radius:12px;padding:20px;border:1px solid #e0e4f0}
.sel-group label{font-size:11px;color:#666;display:block;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
select{width:100%;padding:10px 12px;border:1px solid #d0d5e8;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;cursor:pointer}
select:focus{outline:none;border-color:#1E2B6A}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:16px;border:1px solid #e0e4f0}
.card-label{font-size:10px;color:#888;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card-value{font-size:26px;font-weight:600}
.card-sub{font-size:11px;color:#999;margin-top:3px}
.card.ok .card-value{color:#2d7a2d}.card.warn .card-value{color:#a06000}.card.alert .card-value{color:#c0392b}
.section{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px;border:1px solid #e0e4f0}
.section-title{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.risks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.risk-item{background:#f8f9fc;border-radius:8px;padding:12px}
.risk-label{font-size:12px;color:#555;margin-bottom:6px}
.risk-bar-wrap{height:5px;background:#e0e4f0;border-radius:3px;margin-bottom:6px;overflow:hidden}
.risk-bar{height:5px;border-radius:3px}
.risk-pct{font-size:12px;font-weight:600}
.risk-pct.low{color:#2d7a2d}.risk-pct.mid{color:#a06000}.risk-pct.high{color:#c0392b}
.enc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f2f8}
.enc-row:last-child{border-bottom:none}
.enc-label{font-size:13px;color:#666}.enc-value{font-size:13px;font-weight:600}
.arg-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:6px}
.arg-row.vit{background:#f0faf0;border:1px solid #c8e6c8}
.arg-row.der{background:#fff5f5;border:1px solid #f5c6c6}
.arg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.arg-dot.vit{background:#2d7a2d}.arg-dot.der{background:#c0392b}
.arg-text{flex:1}.arg-badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
.arg-badge.vit{background:#c8e6c8;color:#1a5c1a}.arg-badge.der{background:#f5c6c6;color:#8b1a1a}
.strat-box{border-radius:10px;padding:16px;border-left:4px solid}
.strat-box.manter{background:#f0faf0;border-color:#2d7a2d}
.strat-box.monitor{background:#fffbf0;border-color:#a06000}
.strat-box.revisar{background:#fff5f5;border-color:#c0392b}
.strat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.strat-box.manter .strat-label{color:#2d7a2d}.strat-box.monitor .strat-label{color:#a06000}.strat-box.revisar .strat-label{color:#c0392b}
.strat-desc{font-size:13px;color:#333;line-height:1.6}
.news-filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.nf-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #d0d5e8;background:#fff;color:#555;transition:all .2s}
.nf-btn:hover{border-color:#1E2B6A;color:#1E2B6A}
.nf-btn.active{background:#1E2B6A;color:#fff;border-color:#1E2B6A}

.news-card.critico{border-left-color:#c0392b}
.news-card.relevante{border-left-color:#a06000}
.news-card.informativo{border-left-color:#2B5DA1}

.news-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.news-badge.critico{background:#fde8e8;color:#c0392b}
.news-badge.relevante{background:#fff3e0;color:#a06000}
.news-badge.informativo{background:#e8f0fe;color:#2B5DA1}

.news-meta{font-size:11px;color:#999;margin-bottom:10px}
.news-summary{font-size:13px;color:#444;line-height:1.6;margin-bottom:12px}
.news-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.news-tag{font-size:11px;padding:2px 10px;border-radius:10px;background:#f0f2f8;color:#555;font-weight:500}
.news-impact{background:#f8f9fc;border-radius:8px;padding:10px 12px;font-size:12px;color:#333;line-height:1.5}
.news-impact strong{color:#1E2B6A}
.updated{font-size:11px;color:#aaa;text-align:right;margin-top:4px}
.footer{text-align:center;padding:24px;font-size:12px;color:#bbb}

let currentFilter = 'todos';

function renderNews(){
  const filtered = NEWS.filter(n => {
    if(currentFilter==='todos') return true;
    if(currentFilter==='critico') return n.impacto==='critico';
    if(currentFilter==='relevante') return n.impacto==='relevante';
    if(currentFilter==='fraude') return n.causas.includes('fraude');
    if(currentFilter==='modalidade') return n.causas.includes('modalidade');
    return true;
  });
  const tagLabels={fraude:'Alegação de Fraude',modalidade:'Não Reconhecimento Cartão',cadastro:'Cadastro Incompleto'};
  document.getElementById('news-list').innerHTML = filtered.length===0
    ? '<div style="background:#fff;border-radius:10px;padding:24px;border:1px solid #e0e4f0;color:#888;font-size:14px;text-align:center">Nenhuma notícia encontrada para este filtro.</div>'
    : filtered.map(n=>`
    <div class="news-card ${n.impacto}">
      <div class="news-header">
        <span class="news-badge ${n.impacto}">${n.impacto==='critico'?'CRÍTICO':n.impacto==='relevante'?'RELEVANTE':'INFORMATIVO'}</span>
        <div class="news-title">${n.titulo}</div>
      </div>
      <div class="news-meta">${n.fonte} &nbsp;·&nbsp; ${n.data}</div>
      <div class="news-summary">${n.resumo}</div>
      <div class="news-tags">${n.causas.map(c=>`<span class="news-tag">${tagLabels[c]||c}</span>`).join('')}</div>
      <div class="news-impact"><strong>Impacto nos modelos:</strong> ${n.impactoModelos}</div>
      ${n.url?`<div style="margin-top:10px"><a href="${n.url}" style="font-size:12px;color:#2B5DA1">Ver fonte original</a></div>`:''}
    </div>`).join('');
}

function filterNews(filter, btn){
  currentFilter=filter;
  document.querySelectorAll('.nf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderNews();
}

function switchTab(id, el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

function fmt(n){return n>0?'R$ '+n.toLocaleString('pt-BR'):'-'}
function pctC(p){return p<=15?'low':p<=30?'mid':'high'}
function barC(p){return p<=15?'#2d7a2d':p<=30?'#a06000':'#c0392b'}

function render(){
  const uf=document.getElementById('sel-uf').value;
  const causa=document.getElementById('sel-causa').value;
  const d=DATA[uf][causa];
  if(!d||d.proc===0){document.getElementById('output').innerHTML='<div style="background:#fff;border-radius:10px;padding:24px;border:1px solid #e0e4f0;color:#888;font-size:14px">Sem processos registrados para esta combinação.</div>';return;}
  const derrota=100-d.exito;
  const dmPct=d.proc>0?Math.round(d.dm/d.proc*100):0;
  const dobroPct=d.proc>0?Math.round(d.dobro/d.proc*100):0;
  const relevantNews=NEWS.filter(n=>n.causas.includes(causa)).slice(0,2);
  const newsAlert=relevantNews.filter(n=>n.impacto==='critico').length>0
    ?`<div style="background:#fde8e8;border:1px solid #f5c6c6;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#8b1a1a"><strong>Alerta:</strong> Há ${relevantNews.filter(n=>n.impacto==='critico').length} notícia(s) crítica(s) para este projeto. <span style="cursor:pointer;text-decoration:underline" onclick="document.querySelector('[onclick*=mercado]').click()">Ver Inteligência de Mercado</span></div>`:''
  document.getElementById('output').innerHTML=`
    ${newsAlert}
    <div class="cards">
      <div class="card ${d.exito>=60?'ok':d.exito>=45?'warn':'alert'}">
        <div class="card-label">Chance de vitória</div>
        <div class="card-value">${d.exito}%</div>
        <div class="card-sub">${d.proc} processos</div>
      </div>
      <div class="card ${derrota<=40?'ok':derrota<=55?'warn':'alert'}">
        <div class="card-label">Chance de derrota</div>
        <div class="card-value">${derrota}%</div>
        <div class="card-sub">plena ou parcial</div>
      </div>
      <div class="card">
        <div class="card-label">Ticket médio geral</div>
        <div class="card-value" style="font-size:18px;margin-top:4px">${fmt(d.ticket)}</div>
        <div class="card-sub">valor da causa</div>
      </div>
      <div class="card ${d.ticketDobro>30000?'alert':d.ticketDobro>20000?'warn':'ok'}">
        <div class="card-label">Possível condenação</div>
        <div class="card-value" style="font-size:18px;margin-top:4px">${fmt(d.ticketCond)}</div>
        <div class="card-sub">média nas derrotas</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="section">
        <div class="section-title">Riscos financeiros nas derrotas</div>
        <div style="display:grid;gap:12px">
          <div class="risk-item">
            <div class="risk-label">Dano moral condenado</div>
            <div class="risk-bar-wrap"><div class="risk-bar" style="width:${Math.min(dmPct*3,100)}%;background:${barC(dmPct)}"></div></div>
            <div class="risk-pct ${pctC(dmPct)}">${dmPct}% das derrotas · ${d.dm} casos</div>
          </div>
          <div class="risk-item">
            <div class="risk-label">Restituição em dobro</div>
            <div class="risk-bar-wrap"><div class="risk-bar" style="width:${Math.min(dobroPct*3,100)}%;background:${barC(dobroPct)}"></div></div>
            <div class="risk-pct ${pctC(dobroPct)}">${dobroPct}% das derrotas · ${d.dobro} casos</div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Encerramento e acordo</div>
        <div class="enc-row"><span class="enc-label">Tempo médio do processo</span><span class="enc-value">${d.aging} dias (~${Math.round(d.aging/30)} meses)</span></div>
        <div class="enc-row"><span class="enc-label">Acordos pré-sentença</span><span class="enc-value">${d.acPre} registrados</span></div>
        <div class="enc-row"><span class="enc-label">Acordos pós-sentença</span><span class="enc-value">${d.acPos} registrados</span></div>
        <div class="enc-row"><span class="enc-label">Ticket médio derrota plena</span><span class="enc-value">${fmt(d.ticketDobro)}</span></div>
      </div>
    </div>
    <div class="section" style="margin-bottom:16px">
      <div class="section-title">Fundamentos jurídicos identificados nas decisões</div>
      <div>${d.args_vit.map(a=>`<div class="arg-row vit"><div class="arg-dot vit"></div><span class="arg-text">${a}</span><span class="arg-badge vit">nas vitórias</span></div>`).join('')}
      ${d.args_der.map(a=>`<div class="arg-row der"><div class="arg-dot der"></div><span class="arg-text">${a}</span><span class="arg-badge der">nas derrotas</span></div>`).join('')}</div>
    </div>
    <div class="section">
      <div class="section-title">Diretriz estratégica</div>
      <div class="strat-box ${d.strat}">
        <div class="strat-label">${d.strat==='manter'?'Manter estratégia':d.strat==='monitor'?'Monitorar e ajustar':'Revisar tese — urgente'}</div>
        <div class="strat-desc">${d.strat_txt}</div>
      </div>
    </div>`;
}

render();
renderNews();
</script>
</body>
</html>
